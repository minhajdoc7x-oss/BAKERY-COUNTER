<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakery Counter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:15px;
    text-align:center;
}

#total{
    font-size:48px;
    font-weight:bold;
    margin:20px 0;
    color:green;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    height:90px;
    font-size:32px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    background:#2196F3;
    color:white;
}

.action{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.action button{
    background:#ff5722;
    height:70px;
    font-size:24px;
}
</style>
</head>
<body>

<h2>Bakery Counter</h2>

<div id="total">₹0</div>

<div class="grid">
    <button onclick="add(13)">15</button>
    <button onclick="add(15)">20</button>
    <button onclick="add(20)">25</button>
    <button onclick="add(30)">30</button>
</div>

<div class="action">
    <button onclick="undo()">Undo</button>
    <button onclick="resetAll()">Reset</button>
</div>

<script>
let total = 0;
let history = [];

function add(price){
    total += price;
    history.push(price);
    document.getElementById("total").innerText = "₹" + total;
}

function undo(){
    if(history.length > 0){
        total -= history.pop();
        document.getElementById("total").innerText = "₹" + total;
    }
}

function resetAll(){
    total = 0;
    history = [];
    document.getElementById("total").innerText = "₹0";
}
</script>

</body>
</html>
