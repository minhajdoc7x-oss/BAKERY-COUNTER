<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakery Counter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:15px;
    text-align:center;
}

h2{
    margin-bottom:15px;
}

#total{
    font-size:48px;
    font-weight:bold;
    margin:20px 0 10px;
    color:#0a8f2e;
    transition:.3s ease;
}

#summary{
    display:none;
    background:#fff;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
    font-size:20px;
    font-weight:bold;
    line-height:1.8;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    height:90px;
    font-size:32px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    background:#2196F3;
    color:#fff;
    cursor:pointer;
    transition:all .2s ease;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:scale(.95);
}

.center-btn{
    display:flex;
    justify-content:center;
    margin-top:10px;
}

.center-btn button{
    width:48%;
}

.action{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.action button{
    background:#ff5722;
    height:70px;
    font-size:24px;
}

/* Smooth Animation */

@keyframes smoothShow{
    from{
        opacity:0;
        transform:translateY(-12px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.show{
    animation:smoothShow .35s ease;
}

.item{
    padding:6px 0;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:none;
}
</style>
</head>
<body>

<h2>Bakery Counter</h2>

<div id="total">₹0</div>

<div id="summary"></div>

<div class="grid">
    <button onclick="add(13)">13</button>
    <button onclick="add(15)">15</button>
    <button onclick="add(20)">20</button>
    <button onclick="add(25)">25</button>
</div>

<div class="center-btn">
    <button onclick="add(30)">30</button>
</div>

<div class="action">
    <button onclick="undo()">Undo</button>
    <button onclick="resetAll()">Reset</button>
</div>

<script>
let total = 0;
let history = [];

let qty = {
    13:0,
    15:0,
    20:0,
    25:0,
    30:0
};

const totalDisplay = document.getElementById("total");
const summary = document.getElementById("summary");

function updateDisplay(){

    totalDisplay.textContent = "₹" + total;

    let html = "";

    for(let price in qty){

        if(qty[price] > 0){

            html += `
                <div class="item">
                    ${price} → Qty : ${qty[price]} | ₹${qty[price]*price}
                </div>
            `;
        }
    }

    if(html === ""){

        summary.style.display = "none";

    }else{

        summary.style.display = "block";
        summary.innerHTML = html;

        summary.classList.remove("show");
        void summary.offsetWidth;
        summary.classList.add("show");
    }
}

function add(price){

    total += price;
    history.push(price);
    qty[price]++;

    updateDisplay();
}

function undo(){

    if(history.length > 0){

        let price = history.pop();

        total -= price;
        qty[price]--;

        updateDisplay();
    }
}

function resetAll(){

    total = 0;
    history = [];

    qty = {
        13:0,
        15:0,
        20:0,
        25:0,
        30:0
    };

    updateDisplay();
}

updateDisplay();
</script>

</body>
</html>
