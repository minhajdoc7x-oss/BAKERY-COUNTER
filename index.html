<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakery Counter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:15px;
    text-align:center;
}

h2{
    margin-bottom:15px;
}

#total{
    font-size:48px;
    font-weight:bold;
    margin:20px 0;
    color:green;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    height:90px;
    font-size:32px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    background:#2196F3;
    color:white;
    cursor:pointer;
}

button:active{
    transform:scale(0.97);
}

.center-btn{
    display:flex;
    justify-content:center;
    margin-top:10px;
}

.center-btn button{
    width:48%;
}

.action{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.action button{
    background:#ff5722;
    height:70px;
    font-size:24px;
}
</style>
</head>
<body>

<h2>Bakery Counter</h2>

<div id="total">₹0</div>

<div class="grid">
    <button onclick="add(13)">13</button>
    <button onclick="add(15)">15</button>
    <button onclick="add(20)">20</button>
    <button onclick="add(25)">25</button>
</div>

<div class="center-btn">
    <button onclick="add(30)">30</button>
</div>

<div class="action">
    <button onclick="undo()">Undo</button>
    <button onclick="resetAll()">Reset</button>
</div>

<script>
let total = 0;
let history = [];

const totalDisplay = document.getElementById("total");

function updateDisplay() {
    totalDisplay.textContent = "₹" + total;
}

function add(price) {
    total += price;
    history.push(price);
    updateDisplay();
}

function undo() {
    if(history.length > 0){
        total -= history.pop();
        updateDisplay();
    }
}

function resetAll() {
    total = 0;
    history = [];
    updateDisplay();
}
</script>

</body>
</html>
